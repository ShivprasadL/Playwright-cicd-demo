name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Allows you to trigger this workflow manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to test against'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - example

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci   # <--- Fixed: Added 'npm' here
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # If triggered manually, uses the dropdown choice. If pushed/PR'd, defaults to 'dev'.
      run: npx cross-env ENV=${{ github.event.inputs.environment || 'dev' }} npx playwright test

    # 🚀 THIS IS THE NEW REPORTING STEP
    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30